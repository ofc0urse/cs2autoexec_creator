<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="dark">
<meta name="description" content="Build an autoexec.cfg for Counter-Strike 2 with live crosshair, radar and HUD previews, a visual bind builder and a Steam launch options generator.">
<title>CS2 Autoexec Creator</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23f2a93b'/%3E%3Cpath d='M12 4v6M12 14v6M4 12h6M14 12h6' stroke='%231a1206' stroke-width='2.6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="square"><path d="M12 2v6M12 16v6M2 12h6M16 12h6"/></svg>
      </span>
      <span>CS2 Autoexec <small>Creator</small></span>
    </div>
    <div class="search-wrap">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" id="search" autocomplete="off" spellcheck="false">
      <kbd class="search-kbd" aria-hidden="true">/</kbd>
    </div>
    <div class="switches">
      <div class="seg" id="modeSwitch" role="group"></div>
      <div class="seg" id="langSwitch" role="group"></div>
    </div>
  </div>
</header>

<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>

  <main id="main" tabindex="-1"></main>

  <aside class="preview-panel" id="previewPanel" aria-labelledby="previewTitle">
    <div class="preview-head">
      <h2 id="previewTitle">autoexec.cfg</h2>
      <span class="unit" id="lineCount"></span>
      <button type="button" class="btn small ghost preview-close" id="previewClose">Back</button>
    </div>
    <pre class="cfg" id="cfgPreview" tabindex="0"></pre>
    <div class="preview-actions">
      <button type="button" class="btn primary" id="downloadBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M12 3v12M6 10l6 6 6-6M4 21h16"/></svg>
        <span id="downloadLabel">Download autoexec.cfg</span>
      </button>
      <button type="button" class="btn ct desk-only" id="saveBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M5 3h11l3 3v15H5zM8 3v6h8V3M8 21v-7h8v7"/></svg>
        <span id="saveLabel">Save to CS2</span>
      </button>
      <div class="btn-row">
        <button type="button" class="btn" id="copyBtn">Copy</button>
        <button type="button" class="btn" id="shareBtn">Share link</button>
      </div>
      <div class="btn-row desk-only">
        <button type="button" class="btn small" id="chooseFolderBtn">Choose CS2 folder…</button>
        <button type="button" class="btn small" id="openFolderBtn">Open cfg folder</button>
      </div>
      <div class="desk-status desk-only" id="deskStatus" aria-live="polite"></div>
    </div>
  </aside>
</div>

<button type="button" class="preview-fab" id="previewOpen">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M14 3H6v18h12V7zM14 3v4h4M9 12h6M9 16h6"/></svg>
  <span id="previewOpenLabel">Preview file</span>
  <span class="count" id="previewOpenCount"></span>
</button>

<footer class="footer">
  <p id="tagline"></p>
  <p><span id="footerText"></span> · <span id="envLabel"></span> · <a href="https://github.com/ofc0urse/cs2autoexec_creator" target="_blank" rel="noopener">GitHub</a></p>
</footer>

<dialog id="picker" aria-label="Bind"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/data.js"></script>
<script src="assets/i18n.js"></script>
<script src="assets/core.js"></script>
<script src="assets/previews.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
